<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapCraft</title>
    <link rel="stylesheet" href="/css/style.css" type="text/css" media="screen, projection">
    <script type="text/javascript" src="/openlayers/OpenLayers.js"></script>
    <script type="text/javascript" src="/js/jquery-1.5.1.min.js"></script>
    <script type="text/javascript" src="/js/raphael-min.js"></script>
    <script type="text/javascript" src="/js/underscore-min.js"></script>
    <script type="text/javascript" src="/js/config.js"></script>
    <script type="text/javascript" src="/js/hub.js"></script>
    <script type="text/javascript" src="/js/lang/ru.js"></script>
</head>
<body>
<aside id="sector-sidebar" class="sector-sidebar" aria-label="Управление сектором">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
        <a href="/" class="breadcrumbs__home" aria-label="Главная">⌂ <span>Главная</span></a>
        <span aria-hidden="true">/</span>
        <span id="project-title">Карта</span>
    </nav>
    <label class="sector-search" for="sector-search">
        <span aria-hidden="true">⌕</span>
        <input id="sector-search" class="sector-search__input" type="search" placeholder="Найти сектор" autocomplete="off">
        <kbd class="sector-search__shortcut">/</kbd>
    </label>
    <section id="sector-card" class="sector-card sector-card_empty" aria-live="polite">
        <p class="sector-card__empty-state">Выберите сектор на карте или найдите его по номеру.</p>
    </section>
    <section id="sector-history" class="sector-history" aria-live="polite">
        <h2>История сектора</h2>
        <div id="comments" class="sector-history__entries"><p class="sector-history__empty">История появится после выбора сектора.</p></div>
        <button id="show-full-history" class="sector-history__show-more" type="button" hidden>Показать всю историю</button>
    </section>
    <footer class="connection-status"><span class="connection-status__indicator"></span><span id="connection-label" class="connection-status__label">Подключено</span><button id="reconnect" class="connection-status__retry" type="button" hidden>Повторить</button></footer>
</aside>

<main id="map-area" class="map-workspace">
    <div id="olmap" class="map-workspace__canvas" aria-label="Карта секторов"></div>
    <div class="map-controls map-controls_position_left" aria-label="Масштаб карты">
        <button id="bzoomp" class="map-controls__button" type="button" aria-label="Приблизить">+</button>
        <button id="bzoomm" class="map-controls__button" type="button" aria-label="Отдалить">−</button>
        <button id="bfit" class="map-controls__button" type="button" aria-label="Показать весь проект">⌗</button>
    </div>
    <div class="map-controls map-controls_position_right" aria-label="Инструменты карты">
        <button id="blayers" class="map-controls__button" type="button">▱ <span>Слои</span></button>
        <button id="bfilters" class="map-controls__button" type="button">⌁ <span>Фильтры</span></button>
        <button id="bsettings" class="map-controls__button" type="button">⚙ <span>Настройки</span></button>
        <button id="bonline" class="map-controls__button online-summary" type="button"><span class="online-summary__avatars">● ● ●</span> <span id="online-count">0 онлайн</span></button>
    </div>
    <div id="map-popover" class="map-popover" hidden></div>

    <section id="dchat" class="project-chat project-chat_open" aria-label="Общий чат">
        <button id="chat-toggle" class="project-chat__header" type="button" aria-expanded="true">
            <span>Общий чат</span><span id="chat-unread" class="project-chat__unread-count" hidden>0</span><span class="project-chat__connection">●</span><span class="project-chat__chevron">⌄</span>
        </button>
        <div id="chat-body" class="project-chat__body">
            <aside id="duserlist" class="project-chat__members" aria-label="Участники"><div id="userlist-table"></div><span id="anonscounter"></span></aside>
            <div class="project-chat__feed">
                <div id="chat" class="project-chat__messages"><table><tbody></tbody></table></div>
                <form id="pac_form" class="project-chat__composer">
                    <button id="pac_nick" class="project-chat__user-button" type="button" title="Профиль">?</button>
                    <label class="project-chat__attachment" aria-label="Прикрепить файл">⌕<input type="file" disabled></label>
                    <textarea id="pac_text" rows="1" maxlength="1024" placeholder="Написать сообщение…"></textarea>
                    <button id="send-message" class="project-chat__send" type="submit">Отправить</button>
                </form>
            </div>
        </div>
    </section>
</main>

<div id="dialog-body" class="native-dialog" hidden role="dialog" aria-modal="true"></div>
<script type="text/javascript" src="/js/main.js"></script>
</body>
</html>
